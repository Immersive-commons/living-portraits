<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Portraits — Context Graph</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg:#0d0b10; --panel:#16131c; --panel2:#1c1826; --line:#2a2433;
    --ink:#e9e4f0; --muted:#9a90ad; --dim:#6d6480;
    --gold:#d4a85a; --teal:#78ccc2; --magenta:#ff3df0; --indigo:#8b6cff;
    --hot:#ff8a3c; --cold:#3a5a8a; --good:#6fd08c; --bad:#e8624e;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); overflow:hidden; }
  a { color:var(--teal); }
  header { padding:10px 18px 8px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { margin:0; font-size:17px; letter-spacing:.02em; white-space:nowrap; }
  header h1 small { color:var(--muted); font-weight:400; font-size:12px; letter-spacing:.06em; text-transform:uppercase; margin-left:8px; }
  #chips { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  .chip { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:2px 9px; white-space:nowrap; }
  .chip b { color:var(--ink); font-weight:600; }
  .chip.warn { border-color:#6a4a20; color:#e0a860; }
  nav { display:flex; gap:4px; }
  nav button { background:transparent; color:var(--muted); border:1px solid transparent; border-radius:8px 8px 0 0; padding:5px 13px; font-size:12.5px; cursor:pointer; }
  nav button:hover { color:var(--ink); }
  nav button.on { color:var(--ink); background:var(--panel); border-color:var(--line); border-bottom-color:var(--panel); }
  main { height:calc(100vh - 47px); }
  .tab { display:none; height:100%; }
  .tab.on { display:flex; }
  /* ---------- graph tab ---------- */
  #rail { width:242px; flex:none; background:var(--panel); border-right:1px solid var(--line); padding:12px; overflow:auto; }
  .lbl { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.09em; margin:14px 0 6px; }
  .lbl:first-child { margin-top:0; }
  .lens { display:block; width:100%; text-align:left; background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 9px; margin-bottom:5px; font-size:12.5px; cursor:pointer; }
  .lens:hover { border-color:#4a4060; }
  .lens.on { border-color:var(--gold); background:#241d16; }
  .lens i { display:block; font-style:normal; font-size:10.5px; color:var(--muted); margin-top:2px; line-height:1.35; }
  label.ck { display:flex; align-items:center; gap:7px; font-size:12.5px; margin:4px 0; cursor:pointer; }
  input[type=range] { width:100%; accent-color:var(--gold); }
  .btn { background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:5px 9px; font-size:11.5px; cursor:pointer; }
  .btn:hover { border-color:#4a4060; }
  #center { flex:1; min-width:0; display:flex; flex-direction:column; }
  #netwrap { flex:1; position:relative; min-height:0; }
  #net { position:absolute; inset:0; background:radial-gradient(circle at 50% 40%, #181420, #0d0b10); }
  #lensnote { position:absolute; left:12px; top:12px; z-index:4; width:min(44ch,62%); max-height:38%; overflow:auto; background:rgba(13,11,16,.88); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:11.5px; color:var(--muted); backdrop-filter:blur(4px); }
  #lensnote b { color:var(--ink); }
  #legend { position:absolute; right:12px; bottom:12px; z-index:4; background:rgba(13,11,16,.88); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:11px; backdrop-filter:blur(4px); }
  .row { display:flex; align-items:center; gap:7px; margin-top:4px; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; box-shadow:0 0 8px currentColor; }
  .ln { width:20px; height:0; flex:none; border-top:3px solid #8a7fa0; }
  .ln.dash { border-top-style:dashed; }
  #now { flex:none; height:186px; border-top:1px solid var(--line); background:var(--panel); display:flex; gap:1px; overflow-x:auto; }
  .nowcard { flex:1; min-width:330px; padding:10px 13px; border-right:1px solid var(--line); overflow:auto; }
  .nowcard h3 { margin:0 0 3px; font-size:13px; letter-spacing:.04em; }
  .nowcard .sub { color:var(--muted); font-size:11.5px; }
  .bar { position:relative; background:#221c2e; border-radius:4px; height:16px; margin:3px 0; overflow:hidden; }
  .bar > span { position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,#5a4a8a,#8b6cff); }
  .bar em { position:absolute; inset:0; padding:0 6px; font-style:normal; font-size:10.5px; line-height:16px; display:flex; justify-content:space-between; gap:8px; }
  .bar em span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .bar em span:last-child { flex:none; }
  .asleep .bar > span { background:linear-gradient(90deg,#2f2a44,#4a3f6e); }
  #detail { width:clamp(300px, 27vw, 400px); flex:none; background:var(--panel); border-left:1px solid var(--line); padding:14px; overflow:auto; }
  #detail h2 { margin:0 0 6px; font-size:15px; word-break:break-all; }
  .tag { display:inline-block; font-size:10.5px; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:1px 8px; margin:0 4px 4px 0; }
  .prompt { background:#0d0b10; border:1px solid var(--line); border-radius:8px; padding:9px; color:#cfc6dd; font-size:12px; white-space:pre-wrap; margin:6px 0; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:12px; margin:6px 0; }
  .kv b { color:var(--muted); font-weight:400; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid figure { margin:0; }
  .grid img { width:100%; border-radius:8px; border:1px solid var(--line); display:block; }
  .grid figcaption { font-size:10.5px; color:var(--muted); text-align:center; }
  #detail img.still { width:100%; border-radius:8px; border:1px solid var(--line); margin:6px 0; }
  .hint { color:var(--muted); font-size:12px; }
  /* ---------- text tabs ---------- */
  .sheet { flex:1; overflow:auto; padding:20px 26px; }
  .sheet h2 { font-size:15px; margin:22px 0 8px; letter-spacing:.03em; }
  .sheet h2:first-child { margin-top:0; }
  .cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(430px,1fr)); gap:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:14px 16px; }
  .card h3 { margin:0 0 8px; font-size:13.5px; }
  .mem { border-left:2px solid var(--line); padding:3px 0 3px 10px; margin:8px 0; font-size:12.5px; }
  .mem .meta { color:var(--muted); font-size:11px; }
  .mem.refl { border-left-color:var(--indigo); }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th,td { text-align:left; padding:5px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.07em; }
  td code { color:var(--teal); font-size:12px; }
  .layer { color:var(--gold); font-size:11px; text-transform:uppercase; letter-spacing:.07em; }
  ul.caveats li { margin-bottom:9px; color:#cfc6dd; font-size:12.5px; max-width:100ch; }
  .miss { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Living Portraits <small>context graph</small></h1>
  <div id="chips"></div>
  <nav>
    <button data-tab="graph" class="on">Graph</button>
    <button data-tab="memory">Memory</button>
    <button data-tab="codemap">Codebase map</button>
    <button data-tab="honesty">What this does not know</button>
  </nav>
</header>

<main>
  <section class="tab on" id="tab-graph">
    <div id="rail">
      <div class="lbl">lens</div>
      <div id="lenses"></div>
      <div class="lbl">as the system learned it</div>
      <input type="range" id="scrub" min="0" max="1000" value="1000">
      <div class="row" style="justify-content:space-between">
        <span class="hint" id="scrublabel">—</span>
        <button class="btn" id="play">▶ grow</button>
      </div>
      <div class="lbl">characters</div>
      <div id="charboxes"></div>
      <div class="lbl">edges</div>
      <label class="ck"><input type="checkbox" id="showidles"> show idle self-loops</label>
      <label class="ck"><input type="checkbox" id="showlabels" checked> edge labels</label>
      <div class="lbl">layout</div>
      <button class="btn" id="relayout" style="width:100%">⟳ re-layout</button>
      <div class="hint" style="margin-top:10px" id="counts"></div>
    </div>
    <div id="center">
      <div id="netwrap">
        <div id="net"></div>
        <div id="lensnote"></div>
        <div id="legend"></div>
      </div>
      <div id="now"></div>
    </div>
    <div id="detail"><p class="hint">Loading the context view…</p></div>
  </section>

  <section class="tab" id="tab-memory"><div class="sheet" id="memsheet"></div></section>
  <section class="tab" id="tab-codemap"><div class="sheet" id="mapsheet"></div></section>
  <section class="tab" id="tab-honesty"><div class="sheet" id="honsheet"></div></section>
</main>

<script>
"use strict";
const PALETTE = { phineas:"#d4a85a", seraphina:"#78ccc2", maxx:"#ff3df0" };
const BT = "#8b6cff";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[<>&]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c]));
const fmtH = h => String(((+h % 24) + 24) % 24).padStart(2, "0") + ":00";
const fmtN = n => (n == null ? "—" : Number(n).toLocaleString());
const day = ts => ts ? new Date(ts * 1000).toISOString().slice(0, 10) : "—";
const ago = ts => {
  if (!ts) return "—";
  const s = Date.now() / 1000 - ts;
  if (s < 90) return Math.round(s) + "s ago";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  if (s < 172800) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};
const lerp = (a, b, t) => a + (b - a) * Math.max(0, Math.min(1, t));
const mix = (c1, c2, t) => {           // "#rrggbb" blend
  const p = c => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16));
  const [a, b] = [p(c1), p(c2)];
  return "#" + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, "0")).join("");
};

/* ---------------------------------------------------------------- the lenses.
   One graph, six readings of it. Each names what it colours, and what it cannot show. */
const LENSES = [
  { id:"structure", name:"Structure",
    blurb:"the asset manifest",
    note:"<b>Poses and clips</b> — the graph as the generator made it. Transitions are arrows; idle loops "+
         "live on their pose. Indigo is the <b>bedtime chain</b>, which the daytime walk is masked out of. "+
         "This is the whole of what the May viewer could see." },
  { id:"lived", name:"Lived",
    blurb:"valid time · what was stood in",
    note:"<b>Where a body has actually been.</b> Node heat is visits, node size is dwell, edge weight is "+
         "clips that have <i>rolled</i> rather than merely existing. Grey rings are poses never once "+
         "stood in. Written by the walker (<code>runtime/lived.py</code>), never by the generator." },
  { id:"provenance", name:"Provenance",
    blurb:"transaction time · when it was learned",
    note:"<b>When the system learned each thing exists</b>, derived from artifact mtime so it survives the "+
         "20-minute rebuild. Pull the scrubber to replay the graph accreting. Bright is newest. "+
         "Nodes with no artifact carry no stamp and stay grey — never an invented date." },
  { id:"manner", name:"Manner",
    blurb:"typed edges · derived from prose",
    note:"<b>Manner and valence read out of each clip's own motion prompt</b> — ten manners, "+
         "green rising, red collapsing. Edges the lexicon cannot read are <b>dotted grey and counted "+
         "untyped</b>, not quietly called neutral." },
  { id:"frontier", name:"Frontier",
    blurb:"reachable but never entered",
    note:"<b>The version of itself it has never been.</b> Cyan poses are reachable from where the body "+
         "stands right now and have never once been visited; the number is how many steps away. "+
         "Everything the character has lived in is dimmed." },
  { id:"decision", name:"Decision",
    blurb:"why the next clip",
    note:"<b>The live weighting on every exit</b>, from the same <code>policy.weigh</code> call the walker "+
         "makes: novelty, anti-reverse forgiven by dwell, the soft goal pull, mood band, escape velocity, "+
         "manner last. White ring is here, gold ring is the goal, the lit path is the route between them. "+
         "A <b style='color:#8b6cff'>sleeping</b> character is drawn on its bedtime chain instead — at night "+
         "circadian forces the pick and none of this is consulted." },
];
const LENS_OF = { "Structure lens":"structure", "Lived lens":"lived", "Provenance lens + scrubber":"provenance",
  "Provenance lens (new nodes)":"provenance", "Manner lens":"manner", "Frontier lens / goal path":"frontier",
  "Decision lens + now strip":"decision", "Structure lens (bedtime)":"structure" };

const S = { lens:"structure", chars:new Set(), idles:false, labels:true, cut:Infinity, V:null,
            nodes:null, edges:null, net:null, groups:[], nodeIdx:{}, tmin:0, tmax:0, sel:null };

/* ---------------------------------------------------------------- load */
Promise.all([
  fetch("data/graph/context_view.json").then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
  fetch("prompts/bedtime_routine.json").then(r => r.json()).catch(() => ({ characters:{} })),
]).then(([V, bt]) => { S.V = V; S.bt = bt; boot(); })
  .catch(e => {
    $("#detail").innerHTML = `<p class="hint"><b>No context view.</b><br>${esc(e)}<br><br>
      This viewer reads <code>data/graph/context_view.json</code>, which joins the graph with the lived
      record, provenance, typing, memory and the live decision surface. Build it on the host that holds the
      data:<div class="prompt">python scripts/export_context_view.py</div>
      then serve the project root (<code>python -m http.server</code>) and reload.</p>`;
  });

function boot() {
  const V = S.V;
  buildCircadian();
  buildGraph();
  V.characters.forEach(c => S.chars.add(c));
  // Chrome restores form values when a URL is revisited in the same tab, which silently
  // reopened this viewer with the scrubber part-way back in time and two thirds of the graph
  // missing. The default is the whole graph; state the default rather than inherit one.
  $("#scrub").value = 1000; S.cut = Infinity;
  renderRail(); renderChips(); renderLegend();
  renderNow(); renderMemory(); renderCodemap(); renderHonesty();
  setLens("structure");
  $("#detail").innerHTML = introCard();
  pollLive();
  setInterval(pollLive, 8000);
}

/* the bedtime layer still comes from the routine spec: it is the "when", and it is authored,
   not derived. Same read the May viewer did. */
function buildCircadian() {
  S.CIRC = {}; S.WIN = {}; S.CHAIN = {}; S.BTL = {};
  Object.entries(S.bt.characters || {}).forEach(([cid, c]) => {
    const cc = c.circadian || {}, win = fmtH(cc.bedtime_hour) + "–" + fmtH(cc.wake_hour);
    S.WIN[cid] = { bed:cc.bedtime_hour, wake:cc.wake_hour, metaphor:c.metaphor };
    S.CHAIN[cid] = [c.hub_pose];
    (c.routine || []).forEach(b => {
      if (b.kind === "transition") { S.BTL[b.label] = cid; S.BTL[b.reverse_label] = cid; S.CHAIN[cid].push(b.to); }
      else {
        S.CIRC[cid + ":" + b.at] = { window:win, dwell:(b.dwell != null ? b.dwell : b.dwell_loops), beat:b.beat,
          idles:(b.idles || []).map(i => i.id), isSleep:(b.dwell === "until_wake") };
        (b.idles || []).forEach(i => { S.BTL[i.id] = cid; });
      }
    });
  });
}

/* group clips by (from,label) so one arrow is one behaviour carrying its variants — but the
   context columns (plays, created, manner) are aggregated across the variants, because a
   variant is a rendering of the same intent, not a different one. */
function buildGraph() {
  const V = S.V, g = {};
  V.edges.forEach(e => {
    const k = e.from + "|" + e.label;
    if (!g[k]) g[k] = { ...e, variants:[], plays:0, created:null, play_last:null };
    const G = g[k];
    G.variants.push(e);
    G.plays += (e.plays || 0);
    if (e.created) G.created = G.created == null ? e.created : Math.min(G.created, e.created);
    if (e.play_last) G.play_last = Math.max(G.play_last || 0, e.play_last);
    if (e.manner && !G.manner) { G.manner = e.manner; G.valence = e.valence; }
  });
  S.groups = Object.values(g);

  const stamps = [];
  Object.values(V.nodes).forEach(n => { if (n.created) stamps.push(n.created); });
  S.groups.forEach(e => { if (e.created) stamps.push(e.created); });
  S.tmin = Math.min(...stamps); S.tmax = Math.max(...stamps);

  S.nodes = new vis.DataSet(Object.entries(V.nodes).map(([id, n]) => {
    S.nodeIdx[id] = n;
    return { id, label:id.split(":")[1], shape:"dot", size:12, _n:n,
      font:{ color:"#cfc6dd", size:11, strokeWidth:3, strokeColor:"#0d0b10" } };
  }));
  const selfN = {};
  S.edges = new vis.DataSet(S.groups.map((grp, i) => {
    const e = { id:"E" + i, from:grp.from, to:grp.to, label:grp.label, _g:grp,
      smooth:{ type:"curvedCW", roundness:(grp.kind === "transition" ? 0.24 : 0) + 0.09 * (i % 4) },
      font:{ size:10, strokeWidth:0, background:"#0d0b10" } };
    if (grp.from === grp.to) {
      const k = (selfN[grp.from] = selfN[grp.from] || 0); selfN[grp.from]++;
      e.selfReference = { size:34, angle:k * 0.8 + 0.3, renderBehindTheNode:false };
    }
    return e;
  }));

  S.net = new vis.Network($("#net"), { nodes:S.nodes, edges:S.edges }, {
    physics:{ enabled:true, stabilization:{ iterations:260 },
      barnesHut:{ gravitationalConstant:-11000, centralGravity:0.22, springLength:150,
        springConstant:0.035, damping:0.6, avoidOverlap:0.6 } },
    interaction:{ hover:true, dragNodes:true, tooltipDelay:150 },
  });
  S.net.once("stabilizationIterationsDone", () => S.net.setOptions({ physics:false }));
  $("#relayout").onclick = () => {
    S.net.setOptions({ physics:true }); S.net.stabilize();
    S.net.once("stabilizationIterationsDone", () => S.net.setOptions({ physics:false }));
  };
  S.net.on("click", p => {
    if (p.nodes.length) { S.sel = { kind:"node", id:p.nodes[0] }; nodeCard(p.nodes[0]); }
    else if (p.edges.length) { const e = S.edges.get(p.edges[0]); if (e && e._g) edgeCard(e._g); }
  });
}

/* ---------------------------------------------------------------- rail + chips */
function renderRail() {
  $("#lenses").innerHTML = LENSES.map(l =>
    `<button class="lens" data-lens="${l.id}"><b>${l.name}</b><i>${l.blurb}</i></button>`).join("");
  $("#lenses").querySelectorAll(".lens").forEach(b => b.onclick = () => setLens(b.dataset.lens));
  $("#charboxes").innerHTML = S.V.characters.map(c => {
    const live = S.V.live_characters.includes(c);
    return `<label class="ck"><input type="checkbox" data-char="${c}" checked>
      <span class="dot" style="color:${PALETTE[c] || "#888"};background:${PALETTE[c] || "#888"}"></span>
      ${c}${live ? "" : ' <span class="hint">(off-panel)</span>'}</label>`;
  }).join("");
  $("#charboxes").querySelectorAll("input").forEach(i => i.onchange = () => {
    i.checked ? S.chars.add(i.dataset.char) : S.chars.delete(i.dataset.char); applyLens();
  });
  $("#showidles").onchange = e => { S.idles = e.target.checked; applyLens(); };
  $("#showlabels").onchange = e => { S.labels = e.target.checked; applyLens(); };
  $("#scrub").oninput = e => {
    const t = +e.target.value / 1000;
    S.cut = t >= 1 ? Infinity : S.tmin + (S.tmax - S.tmin) * t;
    applyLens();
  };
  $("#play").onclick = grow;
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "tab-" + b.dataset.tab));
  });
}

function grow() {
  const el = $("#scrub"); let v = 0; el.value = 0;
  const step = () => {
    v += 12; el.value = v;
    el.dispatchEvent(new Event("input"));
    if (v < 1000) requestAnimationFrame(() => setTimeout(step, 22));
  };
  step();
}

function renderChips() {
  const V = S.V, cov = V.meta.style_coverage, st = V.meta.stamped;
  const plays = Object.values(V.lived).reduce((a, l) => a + (l.plays || 0), 0);
  const ent = Object.values(V.memory).reduce((a, m) => a + (m.entries || 0), 0);
  const days = Math.max(...Object.values(V.memory).map(m => m.days || 0));
  const age = (Date.now() / 1000 - V.generated_at) / 60;
  $("#chips").innerHTML = [
    `<b>${fmtN(Object.keys(V.nodes).length)}</b> poses`,
    `<b>${fmtN(V.edges.length)}</b> clips`,
    `<b>${fmtN(st.edges_created)}</b> stamped`,
    `<b>${cov.typed}</b>/${cov.n} typed`,
    `<b>${fmtN(plays)}</b> plays`,
    `<b>${fmtN(ent)}</b> memories · ${days}d`,
  ].map(t => `<span class="chip">${t}</span>`).join("") +
  `<span class="chip ${age > 30 ? "warn" : ""}">view built ${ago(V.generated_at)}${age > 30 ? " · re-run export_context_view.py" : ""}</span>`;
}

function renderLegend() {
  $("#legend").innerHTML = S.V.characters.map(c =>
    `<div class="row"><span class="dot" style="color:${PALETTE[c] || "#888"};background:${PALETTE[c] || "#888"}"></span>${c}</div>`).join("") +
    `<div class="row" style="margin-top:7px"><span class="ln dash" style="border-color:#ff5a3c"></span>transition</div>
     <div class="row"><span class="ln" style="border-color:#8a7fa0"></span>idle loop</div>

/* ---------------------------------------------------------------- the lenses, applied */
function setLens(id) {
  S.lens = id;
  document.querySelectorAll(".lens").forEach(b => b.classList.toggle("on", b.dataset.lens === id));
  const l = LENSES.find(x => x.id === id);
  $("#lensnote").innerHTML = l.note;
  applyLens();
}

function heat(v, max) { return mix("#3a3050", "#ff8a3c", max ? Math.log1p(v) / Math.log1p(max) : 0); }

function applyLens() {
  const V = S.V, lens = S.lens;
  const now = V.now || {};
  const maxVisits = Math.max(1, ...Object.values(V.nodes).map(n => n.visits || 0));
  const maxDwell = Math.max(1, ...Object.values(V.nodes).map(n => n.dwell || 0));
  const maxPlays = Math.max(1, ...S.groups.map(g => g.plays || 0));
  const here = {}, goal = {}, pathE = new Set(), decide = {}, asleep = new Set();
  Object.entries(now).forEach(([c, n]) => {
    if (n.node) here[n.node] = c;
    if (n.goal) goal[n.goal] = c;
    (n.path || []).forEach((p, i, arr) => { if (i) pathE.add(arr[i - 1] + "|" + p); });
    // a sleeping character's exits are weighed by nothing: circadian returns a forced edge
    // before policy is ever called. Drawing a softmax over them would be a picture of a
    // decision that is not being made.
    if ((n.decision || {}).consulted === false) asleep.add(c);
    else ((n.decision || {}).rows || []).forEach(r => decide[r.id] = r);
  });
  const frontier = {};
  Object.values(now).forEach(n => (n.frontier || []).forEach(f => frontier[f.node] = f.hops));

  const nUp = [], nodeVis = {};
  Object.entries(V.nodes).forEach(([id, n]) => {
    const c = PALETTE[n.character] || "#8a8a8a";
    const hidden = !S.chars.has(n.character) || (n.created && n.created > S.cut);
    nodeVis[id] = !hidden;
    let color = c, border = c, size = 12, label = id.split(":")[1], opacity = 1;
    if (lens === "structure") {
      if (S.CIRC[id]) { color = BT; border = BT; label = "🌙 " + label; }
    } else if (lens === "lived") {
      const v = n.visits || 0;
      color = v ? heat(v, maxVisits) : "#241f30";
      border = v ? color : "#4a4060";
      size = 8 + 22 * Math.sqrt((n.dwell || 0) / maxDwell);
      if (!v) label = label + " ·never";
    } else if (lens === "provenance") {
      if (!n.created) { color = "#2a2438"; border = "#4a4060"; }
      else { const t = (n.created - S.tmin) / Math.max(1, S.tmax - S.tmin); color = border = mix("#3b2f6e", "#8fe3d0", t); }
    } else if (lens === "manner") {
      color = "#2a2438"; border = "#4a4060"; size = 9;
    } else if (lens === "frontier") {
      if (frontier[id] != null) { color = "#0f3b40"; border = "#5ce1e6"; size = 18; label = label + " ·" + frontier[id] + " steps"; }
      else { color = "#241f30"; border = "#332c44"; size = 9; opacity = .55; }
    } else if (lens === "decision") {
      color = "#241f30"; border = "#332c44"; size = 9; opacity = .5;
    }
    if (here[id]) { border = "#ffffff"; size = Math.max(size, 20); label = "▶ " + label; opacity = 1; }
    else if (goal[id]) { border = "#ffd479"; size = Math.max(size, 18); label = "◎ " + label; opacity = 1; }
    nUp.push({ id, hidden, size, color:{ background:color, border, highlight:{ background:color, border:"#fff" } },
      borderWidth:(here[id] || goal[id]) ? 4 : 2, label, opacity,
      font:{ color:(here[id] || goal[id]) ? "#fff" : "#cfc6dd", size:(here[id] || goal[id]) ? 13 : 11,
             strokeWidth:3, strokeColor:"#0d0b10" } });
  });
  S.nodes.update(nUp);

  const eUp = [];
  S.groups.forEach((g, i) => {
    const id = "E" + i;
    const isIdle = g.kind !== "transition";
    const isBT = !!S.BTL[g.label];
    let hidden = !S.chars.has(g.character) || (g.created && g.created > S.cut)
              || (isIdle && !S.idles) || !nodeVis[g.from] || !nodeVis[g.to];
    let color = isBT ? BT : (isIdle ? (PALETTE[g.character] || "#888") : "#ff5a3c");
    let width = isIdle ? 1.2 : 2.6, dashes = isIdle ? false : [9, 6], label = S.labels ? g.label : "";
    if (lens === "lived") {
      const p = g.plays || 0;
      color = p ? mix("#4a3f5e", "#ffd479", Math.log1p(p) / Math.log1p(maxPlays)) : "#2c2540";
      width = p ? 1 + 5 * (Math.log1p(p) / Math.log1p(maxPlays)) : 0.8;
      dashes = p ? false : [2, 6];
      label = S.labels ? (p ? g.label + " ×" + p : g.label + " ·unplayed") : "";
    } else if (lens === "provenance") {
      if (!g.created) { color = "#2c2540"; }
      else { const t = (g.created - S.tmin) / Math.max(1, S.tmax - S.tmin); color = mix("#3b2f6e", "#8fe3d0", t); }
      width = 1.8; dashes = false;
    } else if (lens === "manner") {
      if (g.manner) {
        color = g.valence >= 0 ? mix("#8a8f5a", "#6fd08c", Math.min(1, g.valence * 1.6))
                               : mix("#8a6a5a", "#e8624e", Math.min(1, -g.valence * 1.6));
        width = 1.4 + 3.4 * Math.abs(g.valence || 0);
        dashes = false;
        label = S.labels ? g.manner : "";
      } else { color = "#3a3448"; width = 1; dashes = [2, 5]; label = S.labels ? "untyped" : ""; }
    } else if (lens === "frontier") {
      color = "#2f2a3d"; width = 1; dashes = false; label = "";
      if (frontier[g.to] != null) { color = "#3ea0a6"; width = 2.4; }
    } else if (lens === "decision") {
      const r = decide[g.variants[0] && g.variants[0].id] ||
                g.variants.map(v => decide[v.id]).find(Boolean);
      const onPath = pathE.has(g.from + "|" + g.to);
      if (r) { color = "#b79bff"; width = 1.5 + 16 * r.share; label = Math.round(r.share * 100) + "%  " + g.label; hidden = hidden && false; }
      else if (asleep.has(g.character) && S.BTL[g.label]) { color = BT; width = 2.4; dashes = [8, 5]; label = S.labels ? "🌙 " + g.label : ""; }
      else if (onPath) { color = "#ffd479"; width = 3; dashes = [8, 5]; label = S.labels ? g.label : ""; }
      else { color = "#2a2438"; width = 0.8; label = ""; }
      if (r && isIdle) hidden = !S.chars.has(g.character);   // an idle IS a candidate here
    }
    eUp.push({ id, hidden, label, width, dashes,
      color:{ color, highlight:"#ffffff", hover:"#ffffff", opacity:hidden ? 0 : 1 },
      font:{ color:color, size:10, strokeWidth:0, background:"#0d0b10" },
      arrows:isIdle ? { to:{ enabled:true, scaleFactor:0.5 } } : { to:{ enabled:true, scaleFactor:1 } } });
  });
  S.edges.update(eUp);

  const vn = nUp.filter(n => !n.hidden).length, ve = eUp.filter(e => !e.hidden).length;
  $("#counts").innerHTML = `${vn} poses · ${ve} clip groups visible` +
    (S.idles ? "" : `<br><span style="color:var(--dim)">idle self-loops hidden</span>`);
  $("#scrublabel").textContent = S.cut === Infinity ? "everything to " + day(S.tmax) : "up to " + day(S.cut);
}

/* the export is a snapshot; the pose files are written continuously. Re-reading just those two
   small files keeps the strip honest about WHERE the bodies are without pretending the weights
   underneath it were recomputed. */
function pollLive() {
  S.V.live_characters.forEach(c => {
    fetch("data/mind/pose/" + c + ".json?t=" + Date.now()).then(r => r.json()).then(p => {
      const el = document.getElementById("nowpose-" + c);
      if (!el) return;
      const moved = p.node !== (S.V.now[c] || {}).node;
      el.innerHTML = `at <b>${esc((p.node || "").split(":")[1])}</b> · dwell ${fmtN(p.dwell)}
        ${moved ? '<span style="color:#5ce1e6">· moved since this view was built</span>' : ""}`;
    }).catch(() => {});
  });
}

      <div class="card"><h3>Provenance</h3>
        <div class="kv"><b>nodes stamped</b><span>${st.nodes_created} of ${st.nodes}</span>
          <b>edges stamped</b><span>${st.edges_created} of ${st.edges}</span>
          <b>tombstoned</b><span>${pr.nodes_dead} nodes, ${pr.edges_dead} edges</span>
          <b>range</b><span>${day(S.tmin)} → ${day(S.tmax)}</span></div>
        <p class="hint">Invalidation is a diff against the last committed graph, not a flag, so a clip that
        disappears any way at all is tombstoned with its whole record — and the live JSON stays a pure live
        view, which is what makes “the walker never plays a dead clip” true by construction.</p></div>
    </div>
    <h2>The lived record</h2>
    <table><thead><tr><th>character</th><th>visits</th><th>dwell units</th><th>poses stood in</th><th>clips rolled</th><th>plays</th></tr></thead>
    <tbody>${lived}</tbody></table>
    <h2>The weights the body walks</h2>
    <table><thead><tr><th>constant</th><th>value</th></tr></thead><tbody>
      ${Object.entries(V.policy).map(([k, v]) => `<tr><td><code>${esc(k)}</code></td>
        <td>${typeof v === "object" ? esc(JSON.stringify(v)) : esc(v)}</td></tr>`).join("")}
    </tbody></table>`;
}
</script>
</body>
</html>

# Living Portraits -- production health oracle.
#
# Nine deterministic detectors, one per incident that a HUMAN had to notice.
# (This header said SIX while the file gated eight. Corrected 2026-09-08.)
# That is the ratchet this file exists to turn: an incident nobody had a check for becomes a
# check, so it can only cost you once.
#
#   python main.py verify check projects/living-portraits/health/oracle.yaml
#   python main.py verify probe projects/living-portraits/health/oracle.yaml   # determinism
#
# `probe` matters more here than anywhere else in the repo: a health check that flaps is not
# a health check, it is a pager that teaches you to ignore it. Thresholds are deliberately
# coarse and every count is read over a fixed window so two runs agree.
#
# cwd is resolved relative to THIS file's directory (oracle_gate.py contract), so "." is
# health/ and ".." is the project root.
#
# The interpreter is "python", not an absolute path. It used to be one operator's
# monorepo venv, spelled out nine times in a PUBLISHED file -- so the oracle ran on
# exactly one machine and the public repo carried a home directory. Whatever python is
# on PATH is the right answer here: the detectors are stdlib-only and reach the host
# over ssh, so they do not need the project's venv at all.
checks:
  # 1. The wall is painting. Process liveness is NOT the check -- the player has clean-exited
  #    on a fullscreen game before, and a live process printing nothing is a dark wall.
  - id: lp-panels-alive
    cmd: ["python", "checks.py", "panels_alive"]
    cwd: "."
    expect_rc: 0
    stdout_contains: "CHECK panels_alive: PASS"
    stdout_not_contains: "CHECK panels_alive: FAIL"

  # 2. Nobody is stuck in a cul-de-sac. Phineas looped three clips for an hour at
  #    commanding_aether -- one exit, an unreachable goal, and a mood that suppresses
  #    transitions -- and it read as "broken" on the wall long before anything alerted.
  - id: lp-walker-moving
    cmd: ["python", "checks.py", "walker_moving"]
    cwd: "."
    expect_rc: 0
    stdout_contains: "CHECK walker_moving: PASS"
    stdout_not_contains: "CHECK walker_moving: FAIL"

  # 3. The brain never wants what the body cannot reach AT THIS HOUR. Regression guard for
  #    the fix of 2026-08-10: the goal menu and the walk must read the same edge set. When
  #    they did not, one pose stayed unvisited for its entire 76-day life.
  - id: lp-goal-reachable
    cmd: ["python", "checks.py", "goal_reachable"]
    cwd: "."
    expect_rc: 0
    stdout_contains: "CHECK goal_reachable: PASS"
    stdout_not_contains: "CHECK goal_reachable: FAIL"

  # 4. The lived record keeps what it did not write. A flush erased the 76-day backfill's
  #    provenance while keeping its numbers -- the data stayed right and stopped being able
  #    to say how it knew.
  - id: lp-lived-integrity
    cmd: ["python", "checks.py", "lived_integrity"]
    cwd: "."
    expect_rc: 0
    stdout_contains: "CHECK lived_integrity: PASS"
    stdout_not_contains: "CHECK lived_integrity: FAIL"

  # 5. Production matches the repo and nobody hand-edited the box. maxx.json was absent from
  #    production for MONTHS -- one of two live characters running with no persona at all --
  #    and nothing on either side could see it.
  - id: lp-deploy-drift
    cmd: ["python", "checks.py", "deploy_drift"]
    cwd: "."
    expect_rc: 0
    stdout_contains: "CHECK deploy_drift: PASS"
    stdout_not_contains: "CHECK deploy_drift: FAIL"

  # 6. The brain is not quietly failing. 165 gateway 401s and 62 unparseable replies had
  #    accumulated unnoticed, each one a tick where a character stood still.
  - id: lp-error-rate
    cmd: ["python", "checks.py", "error_rate"]
    cwd: "."
    expect_rc: 0
    stdout_contains: "CHECK error_rate: PASS"
    stdout_not_contains: "CHECK error_rate: FAIL"

  # 7. The one real-world input these portraits have is actually arriving. context.py is
  #    fail-soft BY CONTRACT -- "a dead source just omits the clause; it can NEVER break a
  #    heartbeat tick" -- which is correct design and is exactly why nobody noticed the IC
  #    token going 401 on 2026-07-14. For 27 days the characters were told nothing about the
  #    weather, the hour outside, or the building they hang in, and every tick looked
  #    perfectly healthy. Fail-soft without a detector is just silence.
  - id: lp-world-context
    cmd: ["python", "checks.py", "world_context"]
    cwd: "."
    expect_rc: 0
    stdout_contains: "CHECK world_context: PASS"
    stdout_not_contains: "CHECK world_context: FAIL"

  # 8. A reflection was written in the last 48h. It runs once per character per night, in a
  #    window nobody watches, so if it silently stopped the only symptom is a character that
  #    slowly stops having opinions -- which no one would notice for weeks.
  - id: lp-reflection-fired
    cmd: ["python", "checks.py", "reflection_fired"]
    cwd: "."
    expect_rc: 0
    stdout_contains: "CHECK reflection_fired: PASS"
    stdout_not_contains: "CHECK reflection_fired: FAIL"

  # 9. Poses are still being generated, and the failures are not all one thing. From
  #    2026-07-01 to 2026-08-08 every generation failed on `storage-upload-file -> 403`,
  #    886 times, and nothing paged: hf_gen classes 401/403 as kind="auth", autogen only
  #    treats "capability" and "refused" as terminal, so the loop re-queued forever and
  #    looked busy. The ledger counts SUCCESSES, so "0 clips today" read as a frugal day
  #    rather than a dead one. This is the second outage of that exact shape -- see the
  #    27-day world-seam 401 in CHANGELOG v0.4.0 -- so it is the second detector for it.
  - id: lp-generation-healthy
    cmd: ["python", "checks.py", "generation_healthy"]
    cwd: "."
    expect_rc: 0
    stdout_contains: "CHECK generation_healthy: PASS"
    stdout_not_contains: "CHECK generation_healthy: FAIL"
